<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colony Run</title>
    <meta
      name="description"
      content="A top-down rocket colonisation arcade game: land gently on planets, dodge or shoot asteroids, keep colonising."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="visually-hidden" href="#game">Skip to game</a>
    <header class="visually-hidden">
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <h1>Colony Run</h1>
    </header>
    <main id="game">
      <canvas id="scene"></canvas>

      <!-- Three tanks, each a bar over a glyph naming what it holds: air
           (the death clock), fuel (the engine), ammo (the gun). -->
      <div id="hud">
        <div class="gauge">
          <div class="meter" data-meter="air" role="meter" aria-label="Air" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1">
            <div class="meter-fill"></div>
          </div>
          <svg class="gauge-icon" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="7.5" cy="12" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6" />
            <circle cx="14" cy="6.5" r="2.8" fill="none" stroke="currentColor" stroke-width="1.6" />
          </svg>
        </div>

        <div class="gauge">
          <div class="meter" data-meter="fuel" role="meter" aria-label="Fuel" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1">
            <div class="meter-fill"></div>
          </div>
          <svg class="gauge-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 2.4 C13.6 7 16 9.8 16 12.6 A6 6 0 0 1 4 12.6 C4 9.8 6.4 7 10 2.4 Z"
                  fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        </div>

        <div class="gauge">
          <div class="meter" data-meter="ammo" role="meter" aria-label="Ammo" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1">
            <div class="meter-fill"></div>
          </div>
          <svg class="gauge-icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M10 2 C13 5 13.6 7.2 13.6 10 L13.6 15.4 L6.4 15.4 L6.4 10 C6.4 7.2 7 5 10 2 Z"
                  fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M6.4 17.6 L13.6 17.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
          </svg>
        </div>
      </div>

      <!-- The keycaps are the touch targets (.pad) and the hint at once:
           they light and sink when the matching key is held, so the
           controls teach themselves without a caption. S is absent, not
           empty by accident: with no retro thruster there is nothing for
           it to do. Letterforms are stroked paths, not text --- nothing
           on screen is prose (C3). -->
      <div id="controls">
        <button type="button" class="pad key key-w" data-action="thrust" aria-label="Thrust">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.6 2.4 L3.4 7.8 L5 4.4 L6.6 7.8 L8.4 2.4" /></svg>
        </button>
        <button type="button" class="pad key key-a" data-action="rotateLeft" aria-label="Rotate left">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.8 8 L5 2.2 L8.2 8 M3.4 5.9 L6.6 5.9" /></svg>
        </button>
        <button type="button" class="pad key key-d" data-action="rotateRight" aria-label="Rotate right">
          <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2.7 2.2 L2.7 7.8 L4.9 7.8 A2.8 2.8 0 0 0 4.9 2.2 Z" /></svg>
        </button>
        <button type="button" class="pad key key-space" data-action="fire" aria-label="Fire"></button>
      </div>

    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
