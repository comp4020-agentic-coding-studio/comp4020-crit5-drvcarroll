<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colony Run</title>
    <meta
      name="description"
      content="A top-down rocket colonisation arcade game: land gently on planets, dodge or shoot asteroids, keep colonising."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <a class="visually-hidden" href="#game">Skip to game</a>
    <header class="visually-hidden">
      <nav aria-label="Primary">
        <a href="./">Home</a>
      </nav>
      <h1>Colony Run</h1>
    </header>
    <main id="game">
      <canvas id="scene"></canvas>

      <div id="hud">
        <div class="meter" data-meter="colonists" role="meter" aria-label="Colonists" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1">
          <div class="meter-fill"></div>
        </div>
        <div class="meter" data-meter="fuel" role="meter" aria-label="Fuel" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1">
          <div class="meter-fill"></div>
        </div>
        <div class="meter" data-meter="ammo" role="meter" aria-label="Ammo" aria-valuemin="0" aria-valuemax="1" aria-valuenow="1">
          <div class="meter-fill"></div>
        </div>
      </div>

      <div id="touch-controls">
        <button type="button" class="pad" data-action="rotateLeft" aria-label="Rotate left"></button>
        <button type="button" class="pad" data-action="thrust" aria-label="Thrust"></button>
        <button type="button" class="pad" data-action="rotateRight" aria-label="Rotate right"></button>
        <button type="button" class="pad pad-fire" data-action="fire" aria-label="Fire"></button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
